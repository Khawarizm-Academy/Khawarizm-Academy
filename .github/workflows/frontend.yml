name: frontend-ci

on:
  push:
    branches: [main, "Feature/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, "Feature/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint · typecheck · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Phase 12 grep gate (no `isAdmin` UI fallback outside types/tests)
        run: bash scripts/grep-gate.sh
      - name: Phase 13 Arabic-literal grep gate (features must read copy from JSON)
        run: bash scripts/i18n-gate.sh
      - name: Dependency audit (production deps, high-and-above, dated waiver list)
        run: node scripts/audit-gate.mjs
      - name: Tests
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: https://example.invalid/api
        run: npm run build
      - name: Phase 13 chunk budget (shell ±3 KB, route chunks < 90 KB, lazy engines)
        run: node scripts/bundle-budget.mjs
